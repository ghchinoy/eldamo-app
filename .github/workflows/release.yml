name: Release App Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Desktop Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: Eldamo-macOS.zip
            build_tags: 'sqlite_fts5'
          - os: ubuntu-latest
            asset_name: Eldamo-Linux.tar.gz
            build_tags: 'sqlite_fts5,webkit2_41'

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails v2 CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Frontend Dependencies
        run: |
          npm ci --prefix frontend

      - name: Build Wails App
        run: |
          wails build -tags "${{ matrix.build_tags }}"

      - name: Package macOS Application (.zip)
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          zip -r ../../Eldamo-macOS.zip *.app

      - name: Package Linux Application (.tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build/bin
          tar -czvf ../../Eldamo-Linux.tar.gz Eldamo

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
