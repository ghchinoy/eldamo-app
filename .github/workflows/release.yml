name: Release App Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Desktop Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: Eldamo-macOS.dmg
            build_tags: 'sqlite_fts5'
          - os: ubuntu-latest
            asset_name: Eldamo-Linux.tar.gz
            build_tags: 'sqlite_fts5,webkit2_41'

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install macOS Build Dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install create-dmg

      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails v2 CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Frontend Dependencies
        run: |
          npm ci --prefix frontend

      - name: Build Wails App
        run: |
          wails build -tags "${{ matrix.build_tags }}"

      - name: Import macOS Code Signing Certificates
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Sign & Notarize macOS Application (.app)
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH="build/bin/Eldamo Desktop.app"
          
          # 1. Sign .app bundle with hardened runtime
          codesign --deep --force --options runtime --sign "Developer ID Application: Hussain Chinoy (RXEF4MXK8Y)" "$APP_PATH"
          
          # 2. Compress .app for notarization
          ditto -c -k --keepParent "$APP_PATH" "build/bin/EldamoApp.zip"
          
          # 3. Submit .app zip to Apple Notarytool
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > AuthKey.p8
          xcrun notarytool submit "build/bin/EldamoApp.zip" \
            --key AuthKey.p8 \
            --key-id ${{ secrets.APPLE_API_KEY_ID }} \
            --issuer ${{ secrets.APPLE_API_ISSUER_ID }} \
            --wait
          
          # 4. Staple ticket directly onto .app bundle before packaging DMG
          xcrun stapler staple "$APP_PATH"
          rm -f AuthKey.p8 "build/bin/EldamoApp.zip"

      - name: Package macOS Application (.dmg)
        if: matrix.os == 'macos-latest'
        run: |
          create-dmg \
            --volname "Eldamo Installer" \
            --volicon "build/appicon.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Eldamo Desktop.app" 175 120 \
            --hide-extension "Eldamo Desktop.app" \
            --app-drop-link 425 120 \
            "Eldamo-macOS.dmg" \
            "build/bin/Eldamo Desktop.app"

      - name: Sign & Notarize macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --sign "Developer ID Application: Hussain Chinoy (RXEF4MXK8Y)" Eldamo-macOS.dmg
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > AuthKey.p8
          xcrun notarytool submit Eldamo-macOS.dmg \
            --key AuthKey.p8 \
            --key-id ${{ secrets.APPLE_API_KEY_ID }} \
            --issuer ${{ secrets.APPLE_API_ISSUER_ID }} \
            --wait
          xcrun stapler staple Eldamo-macOS.dmg
          rm -f AuthKey.p8

      - name: Package Linux Application (.tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build/bin
          tar -czvf ../../Eldamo-Linux.tar.gz Eldamo

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
